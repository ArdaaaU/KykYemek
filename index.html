        header {

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }

            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            min-height: 100px;
            padding: 15px;

            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            position: relative;
        }

            max-height: 90vh; overflow-y: auto;
        }

        "27": { d: "Salı", a: "Haşlanmış Yumurta", s: "Patates Kızartması / Fırın Patates", y: "Pankek + Bal + Tereyağ", e: "Beyaz Peynir, Siyah/Yeşil Zeytin, Çay", k: "955" },
        "28": { d: "Çarşamba", a: "Sucuklu Omlet", s: "Patates Salatası / Patates Kavurması", y: "Açma", e: "Kaşar Peynir, Siyah/Yeşil Zeytin, Çay", k: "1135" },
        "29": { d: "Perşembe", a: "Menemen", s: "Ekmek Pizza", y: "Mozaik Kek", e: "Beyaz Peynir, Siyah/Yeşil Zeytin, Çay", k: "875" },
        "30": { d: "Cuma", a: "Sade Omlet", s: "Haşlanmış Patates", y: "Simit", e: "Tulum / Kaşar Peyniri, Siyah/Yeşil Zeytin, Çay", k: "855" },
        "31": { d: "Cumartesi", a: "Haşlanmış Yumurta", s: "Salçalı Sosis / Sosis Kızartması", y: "Peynirli/Ispanaklı Börek", e: "Kaşar Peynir, Siyah/Yeşil Zeytin, Çay", k: "910" }
    };

    function build(mode) {
        const calendar = document.getElementById('calendar');
        calendar.innerHTML = '';
        const dataSet = mode === 'dinner' ? dinnerData : breakfastData;

        // Ekim 2026 Perşembe günü başlıyor (3 adet boş slot ekliyoruz Pazartesi, Salı, Çarşamba için)
        for(let i=0; i<3; i++) {
            const div = document.createElement('div');
            div.className = 'day-card empty-slot';
            calendar.appendChild(div);
        }

        // Ekim ayı 31 gün
        for(let day=1; day<=31; day++) {
            const data = dataSet[day];
            const isTodayClass = (day === today && currentMonth === 9) ? 'is-today' : '';
            const card = document.createElement('div');
            card.className = `day-card ${isTodayClass}`;
            card.innerHTML = `
                ${(day === today && currentMonth === 9) ? '<div class="today-tag">BUGÜN</div>' : ''}
                <div class="day-number">${day}</div>
                <div class="main-item-preview">${data.a}</div>
            `;
            card.onclick = () => openModal(day, mode);
            calendar.appendChild(card);
        }
    }

    function openModal(day, mode) {
        const d = mode === 'dinner' ? dinnerData[day] : breakfastData[day];

        document.getElementById('m-date').innerText = day < 10 ? '0' + day : day;
        document.getElementById('m-day').innerText = d.d + " Ekim 2026";

        const details = document.getElementById('modal-details');
        details.innerHTML = mode === 'dinner' ? `
            <div class="detail-item"><div class="icon-circle">🥣</div><div class="detail-text"><label>Çorba</label><span>${d.c}</span></div></div>
            <div class="detail-item"><div class="icon-circle">🍖</div><div class="detail-text"><label>Ana Yemek</label><span>${d.a}</span></div></div>
            <div class="detail-item"><div class="icon-circle">🥗</div><div class="detail-text"><label>Alternatif</label><span>${d.s}</span></div></div>
            <div class="detail-item"><div class="icon-circle">🍚</div><div class="detail-text"><label>Yardımcı</label><span>${d.y}</span></div></div>
            <div class="detail-item"><div class="icon-circle">🍎</div><div class="detail-text"><label>Ek</label><span>${d.e}</span></div></div>
        ` : `
            <div class="detail-item"><div class="icon-circle">🍳</div><div class="detail-text"><label>Sıcak Kahvaltı</label><span>${d.a}</span></div></div>
            <div class="detail-item"><div class="icon-circle">🥐</div><div class="detail-text"><label>Hamur İşi / Yan</label><span>${d.s}</span></div></div>
            <div class="detail-item"><div class="icon-circle">🧀</div><div class="detail-text"><label>Peynir</label><span>${d.y}</span></div></div>
            <div class="detail-item"><div class="icon-circle">☕</div><div class="detail-text"><label>Ekstra / İçecek</label><span>${d.e}</span></div></div>
        `;

        document.getElementById('m-kcal').innerText = d.k === "-" ? `⚡ Kalori Verisi Yok` : `⚡ Ortalama ${d.k} kkal`;
        document.getElementById('overlay').style.display = 'flex';
        document.body.style.overflow = 'hidden'; // Scrollu engelle
    }

    function switchMenu(mode, event) {
        currentMode = mode;
        const btns = document.querySelectorAll('.tab-btn');
        btns.forEach(b => b.classList.remove('active'));
        event.currentTarget.classList.add('active');
        
        document.documentElement.style.setProperty('--accent', mode === 'dinner' ? 'var(--accent-dinner)' : '#2563eb');
        build(mode);
    }

    function closeModal() { 
        document.getElementById('overlay').style.display = 'none'; 
        document.body.style.overflow = 'auto'; // Scrollu aç
    }

    window.onclick = (e) => { if(e.target == document.getElementById('overlay')) closeModal(); }
    
    build('dinner');
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
