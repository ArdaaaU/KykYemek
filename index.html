<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eylül 2026 Yemek Rehberi | GSB Manisa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%230f172a'/%3E%3Cpath d='M30 45 L50 65 L75 35' stroke='white' stroke-width='8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M25 70 C35 80, 65 80, 75 70' stroke='%23f59e0b' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.9);
            --glass-border: rgba(255, 255, 255, 0.4);
            --primary: #0f172a;
            --accent: #2563eb; 
            --accent-dinner: #dc2626; 
            --text-main: #1e293b;
            --text-muted: #64748b;
            --today-glow: #f59e0b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            background-attachment: fixed;
            margin: 0;
            color: var(--text-main);
            -webkit-tap-highlight-color: transparent;
        }

        header {
            padding: 40px 20px 20px;
            text-align: center;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
        }

        header h1 { margin: 0; font-size: 0.8rem; letter-spacing: 3px; color: #64748b; font-weight: 700; text-transform: uppercase; }
        header h2 { margin: 10px 0; font-size: 1.8rem; font-weight: 800; color: var(--primary); }

        .menu-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 12px 20px;
            border-radius: 50px;
            border: 2px solid #e2e8f0;
            background: white;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px 80px; }

        .calendar-nav { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; margin-bottom: 15px; text-align: center; }
        .calendar-nav div { font-weight: 700; color: var(--text-muted); font-size: 0.7rem; text-transform: uppercase; }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }

        .day-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            min-height: 100px;
            padding: 15px;
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            position: relative;
        }

        .day-card:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); border-color: var(--accent); }
        
        .day-number { font-size: 1.3rem; font-weight: 800; color: var(--primary); margin-bottom: 5px; }
        .main-item-preview { font-size: 0.75rem; color: var(--text-muted); font-weight: 500; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

        .is-today { background: #fffbeb !important; border: 2px solid var(--today-glow) !important; }
        .today-tag { position: absolute; top: 8px; right: 8px; font-size: 0.55rem; background: var(--today-glow); color: white; padding: 2px 5px; border-radius: 4px; font-weight: 800; }

        .empty-slot { background: rgba(0, 0, 0, 0.02); border: 1px dashed #cbd5e1; cursor: default; }

        /* Modal */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); z-index: 9999;
            align-items: center; justify-content: center; padding: 15px; box-sizing: border-box;
        }

        .modal-content {
            background: white; width: 100%; max-width: 450px; border-radius: 25px;
            padding: 30px; position: relative; animation: slideUp 0.3s ease-out;
            max-height: 90vh; overflow-y: auto;
        }

        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .close-modal { position: absolute; top: 15px; right: 15px; background: #f1f5f9; border: none; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }

        .modal-header h3 { font-size: 2rem; margin: 0; color: var(--primary); }
        .modal-header p { color: var(--text-muted); margin: 5px 0 25px; font-weight: 600; }

        .detail-item { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; padding-bottom: 12px; border-bottom: 1px solid #f1f5f9; }
        .detail-item:last-of-type { border-bottom: none; }
        
        .icon-circle { width: 44px; height: 44px; background: #f8fafc; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 1.2rem; }

        .detail-text label { display: block; font-size: 0.6rem; font-weight: 800; text-transform: uppercase; color: var(--text-muted); margin-bottom: 2px; }
        .detail-text span { font-size: 0.95rem; font-weight: 600; color: #334155; line-height: 1.2; }

        .kcal-tag { background: #f1f5f9; padding: 12px 20px; border-radius: 12px; font-weight: 800; font-size: 0.85rem; display: block; text-align: center; margin-top: 20px; color: var(--primary); }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            header { padding: 30px 15px 15px; }
            header h2 { font-size: 1.4rem; }
            .calendar-grid, .calendar-nav { gap: 6px; }
            .day-card { min-height: 60px; padding: 10px 5px; border-radius: 12px; align-items: center; }
            .day-number { font-size: 1.1rem; margin-bottom: 0; }
            .main-item-preview { display: none; }
            .today-tag { font-size: 0.45rem; top: 4px; right: 4px; padding: 1px 3px; }
            .modal-content { padding: 25px 20px; }
            .modal-header h3 { font-size: 1.6rem; }
            .tab-btn { padding: 10px 15px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

<header>
    <h1>made by Arda Utancak</h1>

    <div class="menu-tabs">

    function build(mode) {
        const calendar = document.getElementById('calendar');
        calendar.innerHTML = '';
        const dataSet = mode === 'dinner' ? dinnerData : breakfastData;

        // Eylül 2026 Salı günü başlıyor (1 adet boş slot ekliyoruz Pazartesi için)
        for(let i=0; i<1; i++) {
            const div = document.createElement('div');
            div.className = 'day-card empty-slot';
            calendar.appendChild(div);
        }

        // Eylül ayı 30 gün
        for(let day=1; day<=30; day++) {
            const data = dataSet[day];
            const isTodayClass = (day === today && currentMonth === 8) ? 'is-today' : '';
            const card = document.createElement('div');
            card.className = `day-card ${isTodayClass}`;
            card.innerHTML = `
                ${(day === today && currentMonth === 8) ? '<div class="today-tag">BUGÜN</div>' : ''}
                <div class="day-number">${day}</div>
                <div class="main-item-preview">${data.a}</div>
            `;
            card.onclick = () => openModal(day, mode);
            calendar.appendChild(card);
        }
    }

        document.getElementById('m-date').innerText = day < 10 ? '0' + day : day;
        document.getElementById('m-day').innerText = d.d + " Eylül 2026";

        details.innerHTML = mode === 'dinner' ? `

        document.getElementById('m-kcal').innerText = d.k === "-" ? `⚡ Kalori Verisi Yok` : `⚡ Ortalama ${d.k} kkal`;
        document.getElementById('overlay').style.display = 'flex';
        document.body.style.overflow = 'hidden'; // Scrollu engelle
    }

    function switchMenu(mode, event) {
        currentMode = mode;
        const btns = document.querySelectorAll('.tab-btn');
        btns.forEach(b => b.classList.remove('active'));
        event.currentTarget.classList.add('active');
        
        document.documentElement.style.setProperty('--accent', mode === 'dinner' ? 'var(--accent-dinner)' : '#2563eb');
        build(mode);
    }

    function closeModal() { 
        document.getElementById('overlay').style.display = 'none'; 
        document.body.style.overflow = 'auto'; // Scrollu aç
    }

    window.onclick = (e) => { if(e.target == document.getElementById('overlay')) closeModal(); }
    
    build('dinner');
</script>
<script defer src="/<unique-path>/script.js"></script>
</body>
</html>
